<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外來入侵種動物防治通報網 - 管理者模式</title>
    <style>
        :root { --primary: #3b82f6; --bg: #f8fafc; --sidebar-bg: #0f172a; font-size: 125%; }
        * { box-sizing: border-box; } 
        body { font-family: 'Microsoft JhengHei', sans-serif; margin: 0; height: 100dvh; overflow: hidden; background: var(--bg); }
        
        .interface-container { width: 100%; height: 100dvh; display: none; overflow: hidden; }
        .interface-container.active { display: flex; }

        #intro-interface { flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        .page { 
            display: none; flex-direction: column; align-items: center; justify-content: flex-start; 
            width: 100%; height: 100dvh; overflow-y: auto; padding: 80px 20px 40px 20px; animation: fadeIn 0.4s; text-align: center; 
        }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .welcome-title { font-size: 2.5rem; color: #1e293b; margin-bottom: 5px; font-weight: bold; margin-top: auto; }
        .welcome-subtitle { font-size: 2rem; color: #475569; margin-top: 0; margin-bottom: 40px; }
        
        .welcome-actions { display: flex; flex-direction: row; gap: 20px; justify-content: center; width: 100%; max-width: 500px; margin: 0 auto auto auto; }
        .welcome-actions .btn { flex: 1; padding: 15px 0; white-space: nowrap; }

        .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 500px; padding: 20px; margin: auto; }
        .role-grid:not(.role-grid--no-last-span) > div:last-child { grid-column: 1 / -1; justify-self: center; width: calc(50% - 7.5px); }
        
        .role-card { padding: 20px; border-radius: 12px; cursor: pointer; color: white; transition: 0.3s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); font-size: 1.1rem; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .role-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(0,0,0,0.2); filter: brightness(1.1); }
        .role-card small { display: block; margin-top: 5px; opacity: 0.9; font-size: 0.85rem; font-weight: normal; }
        
        .btn { padding: 15px 40px; border-radius: 30px; border: none; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(59,130,246,0.3); }
        .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: #eff6ff; }

        .back-nav { position: fixed; top: 20px; left: 20px; z-index: 100; cursor: pointer; display: flex; align-items: center; color: #475569; font-weight: bold; font-size: 1.1rem; transition: 0.2s; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.8); backdrop-filter: blur(5px); }
        .back-nav:hover { background: #e2e8f0; }

        /* ====== 主手冊介面 ====== */
        #manual-interface { flex-direction: row; height: 100dvh; }
        #sidebar { width: 280px; background: var(--sidebar-bg); color: white; padding: 20px 10px; overflow-y: auto; flex-shrink: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; height: 100dvh; }
        
        #main-content { flex: 1; display: flex; flex-direction: column; padding: 40px 40px 100px 40px; align-items: center; overflow-y: auto; height: 100dvh; position: relative; }
        
        .acc-btn { background: #1e293b; color: #e2e8f0; cursor: pointer; padding: 14px; width: 100%; border: none; text-align: left; border-radius: 6px; margin-bottom: 5px; font-weight: bold; font-size: 1.05rem; }
        .acc-btn:hover { background: #3b82f6; }
        .group-btn { display: block; width: 100%; padding: 12px 25px; background: transparent; color: #94a3b8; border: none; text-align: left; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
        .group-btn:hover, .group-btn.active { color: #60a5fa; background: rgba(255,255,255,0.05); }
        
        #tab-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 940px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        .tab-item { padding: 8px 20px; cursor: pointer; border-radius: 20px; background: #e2e8f0; color: #475569; font-weight: bold; transition: 0.2s; }
        .tab-item.active { background: var(--primary); color: white; }

        #text-box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 940px; border-left: 6px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; flex-shrink: 0; }
        #v-title { margin-top: 0; font-size: 1.5rem; color: #1e293b; margin-bottom: 10px; }
        #v-desc { margin: 0; font-size: 1.1rem; color: #475569; line-height: 1.6; }

        /* ====== YouTube 按鈕專屬樣式 ====== */
        #youtube-actions {
            display: none; /* 預設隱藏，由 JS 控制顯示 */
            flex-direction: row;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #cbd5e1;
            justify-content: center;
        }
        .yt-btn {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .yt-btn-android { background: #10b981; color: white; }
        .yt-btn-android:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(16,185,129,0.3); }
        .yt-btn-ios { background: #1e293b; color: white; }
        .yt-btn-ios:hover { background: #0f172a; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(30,41,59,0.3); }

        #media-container { width: 100%; display: flex; justify-content: center; margin-bottom: 50px; flex-shrink: 0; }
        
        #media-wrapper {
            display: inline-flex; 
            max-width: 100%; 
            background: transparent; 
            position: relative;
        }

        .media-content { 
            width: auto;     
            height: auto;
            max-width: 100%; 
            max-height: 55dvh; 
            border-radius: 8px;
            box-shadow: 0 25px 35px -5px rgba(0,0,0,0.15), 0 15px 15px -5px rgba(0,0,0,0.1);
            border: 2px solid #cbd5e1; 
            display: none; 
        }

        /* ====== PDF 專屬卡片樣式優化 ====== */
        #display-pdf-actions {
            display: none; 
            flex-direction: column; 
            gap: 15px; 
            padding: 35px 40px; 
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            width: 100%;
            min-width: 280px;
            align-items: center; 
            justify-content: center;
        }
        .pdf-btn {
            width: 100%;
            padding: 14px 20px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            font-size: 1.15rem; 
            font-weight: bold; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
        }
        .pdf-btn-view { background: #3b82f6; color: white; }
        .pdf-btn-view:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .pdf-btn-dl { background: #10b981; color: white; }
        .pdf-btn-dl:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        
        /* ====== PDF 全螢幕瀏覽器優化 ====== */
        #pdf-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; 
            justify-content: center; backdrop-filter: blur(5px);
        }
        #pdf-modal-content {
            width: 95%; height: 95%; max-width: 1400px; background: #f8fafc; 
            border-radius: 12px; overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        /* PDF 頂部工具列 */
        .pdf-modal-header {
            background: #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f172a;
            flex-shrink: 0;
        }
        .pdf-modal-title {
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }
        .pdf-modal-tools {
            display: flex;
            gap: 10px;
        }
        .tool-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tool-btn-dl { background: #10b981; color: white; }
        .tool-btn-dl:hover { background: #059669; }
        .tool-btn-close { background: #ef4444; color: white; }
        .tool-btn-close:hover { background: #dc2626; }

        /* 手機版適應 */
        @media (max-width: 768px) {
            .welcome-title { font-size: 2rem; margin-top: 20px; }
            .welcome-subtitle { font-size: 1.4rem; margin-bottom: 25px; }
            .btn { padding: 12px 25px; font-size: 1rem; margin-bottom: 10px; }
            .welcome-actions { flex-direction: column; width: 100%; max-width: 350px; padding: 0 20px; margin: 0 auto auto auto; }
            .welcome-actions .btn { width: 100%; margin-bottom: 15px; }
            
            .role-grid { grid-template-columns: 1fr; padding: 10px; }
            .role-grid > div:last-child { width: 100% !important; justify-self: stretch !important; }
            
            #quick-guide-list {
                display: grid !important; 
                grid-template-columns: repeat(2, 1fr); 
                gap: 10px; padding: 0 10px; height: auto !important; margin-bottom: 15px !important; 
            }
            #quick-guide-list .btn {
                width: 100%; height: 100%; min-height: 60px; white-space: normal; padding: 10px;
                font-size: 0.95rem !important; display: flex; align-items: center; justify-content: center; margin-bottom: 0;
            }

            #full-manual-btn {
                width: calc(100% - 20px) !important; margin: 0 10px !important; min-height: 60px; padding: 10px;
                font-size: 0.95rem !important; display: flex; align-items: center; justify-content: center;
            }

            .interface-container.active#manual-interface { display: block; } 
            
            #sidebar { 
                position: fixed; top: 0; left: -100%; width: 80%; max-width: 300px; 
                height: 100dvh; z-index: 9999; transition: left 0.3s ease; overflow-y: auto; 
                padding-bottom: 80px; border-right: 2px solid #0f172a;
            }
            #sidebar.active { left: 0; }
            
            #main-content { display: block; padding: 20px 15px 120px 15px; height: 100dvh; overflow-y: auto; }
            
            .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 9998; }
            .sidebar-overlay.active { display: block; }
            
            .mobile-menu-btn {
                display: flex !important; align-items: center; justify-content: center;
                position: fixed; bottom: 20px; right: 20px; background: #3b82f6; color: white; 
                border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 1.8rem;
                z-index: 9997; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
            }
            
            #text-box { padding: 20px; }
            #v-title { font-size: 1.3rem; }
            #v-desc { font-size: 1rem; }
            
            .media-content { max-height: none; width: 100%; height: auto; }

            #display-pdf-actions { padding: 25px 20px; width: 100%; min-width: unset; }
            #pdf-modal-content { width: 100%; height: 100%; border-radius: 0; }
            .tool-btn span { display: none; } /* 手機版只顯示圖示省空間 */
            
            /* 手機版 YouTube 按鈕變成垂直排列 */
            #youtube-actions { flex-direction: column; }
            .yt-btn { width: 100%; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .page { padding-top: 60px; justify-content: flex-start; }
            .role-grid { grid-template-columns: repeat(2, 1fr); }
            #main-content { padding-bottom: 80px; }
        }
    </style>
</head>
<body>

    <div id="intro-interface" class="interface-container active">
        <div id="page-welcome" class="page active">
            <div class="welcome-title">歡迎使用</div>
            <div class="welcome-subtitle">外來入侵種動物防治通報網 - 管理者模式</div>
            <div class="welcome-actions">
                <button class="btn btn-outline" onclick="window.open('https://fonghs.emct.tw/tis/login')">進入 TIS 網站(測試版)</button>
                <button class="btn btn-primary" onclick="showIntroPage('page-roles')">操作手冊</button>
            </div>
        </div>

        <div id="page-roles" class="page">
            <div class="back-nav" onclick="showIntroPage('page-welcome')">⬅ 回首頁</div>
            <h2 style="font-size: 1.8rem; margin-bottom: 20px; color: #1e293b; margin-top: 20px;">請選擇您的身分</h2>
            <div class="role-grid">
                <div class="role-card" style="background:#eab308" onclick="selectRole('管理者')"><span style="font-size:1.1rem">管理者</span><small>[地方政府]</small></div>
                <div class="role-card" style="background:#3b82f6" onclick="selectRole('點收者')"><span style="font-size:1.1rem">點收者</span><small>[點收廠商]</small></div>
                <div class="role-card" style="background:#8b5cf6" onclick="selectRole('使用者')"><span style="font-size:1.1rem">使用者</span><small>[獵人]</small></div>
            </div>
        </div>
        <div id="page-guide" class="page">
            <div class="back-nav" onclick="showIntroPage('page-roles')">⬅ 重新選擇身分</div>
            
            <div id="temp-bulletin" style="background-color: #fefce8; border: 2px solid #fde047; border-radius: 12px; padding: 20px; width: 100%; max-width: 800px; margin: 20px auto 30px auto; box-shadow: 0 4px 15px rgba(234, 179, 8, 0.15); text-align: left;">
                <div style="display: flex; align-items: center; margin-bottom: 15px; justify-content: center;">
                    <span style="font-size: 1.8rem; margin-right: 12px;">📣</span>
                    <strong style="font-size: 1.25rem; color: #854d0e;">115 年 6 月 9 日，新網站與 App 同步更新</strong>
                </div>
                
                <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn" style="background: #ffffff; border: 2px solid #d97706; color: #d97706; border-radius: 30px; padding: 10px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex: 1; min-width: 200px; max-width: 240px;" 
                            onclick="jumpToManualByTitle('Android 用戶')"
                            onmouseover="this.style.background='#fef3c7'" onmouseout="this.style.background='#ffffff'">
                        <div style="font-weight: bold; font-size: 1.05rem;">📱 如何更新密碼</div>
                        <div style="font-size: 0.9rem;">(Android 看這邊)</div>
                    </button>
                    
                    <button class="btn" style="background: #ffffff; border: 2px solid #d97706; color: #d97706; border-radius: 30px; padding: 10px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex: 1; min-width: 200px; max-width: 240px;" 
                            onclick="jumpToManualByTitle('iPhone 用戶')"
                            onmouseover="this.style.background='#fef3c7'" onmouseout="this.style.background='#ffffff'">
                        <div style="font-weight: bold; font-size: 1.05rem;">🍎 如何更新密碼</div>
                        <div style="font-size: 0.9rem;">(iPhone 看這邊)</div>
                    </button>
                    
                    <button class="btn" style="background: #ffffff; border: 2px solid #ef4444; color: #ef4444; border-radius: 30px; padding: 10px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex: 1; min-width: 200px; max-width: 240px;" 
                            onclick="jumpToManualByTitle('忘記密碼', 'App指南')"
                            onmouseover="this.style.background='#fee2e2'" onmouseout="this.style.background='#ffffff'">
                        <div style="font-weight: bold; font-size: 1.1rem;">❓ 忘記密碼怎麼辦？</div>
                    </button>
                </div>
            </div>
            <h2 id="role-title" style="font-size: 1.8rem; margin-bottom: 30px; color: #1e293b; margin-top: 0;"></h2>
            <div id="quick-guide-list" style="display:flex; flex-wrap:wrap; justify-content:center; gap:15px; max-width:800px; margin-bottom:30px;"></div>
            <button id="full-manual-btn" class="btn btn-primary" onclick="enterFullManual()">查看所有操作手冊</button>
        </div>
    </div>

    <div id="manual-interface" class="interface-container">
        <button id="mobile-menu-btn" class="mobile-menu-btn" style="display:none;" onclick="toggleMobileSidebar()">☰</button>
        <div id="mobile-overlay" class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>
        
        <div id="sidebar">
            <div style="padding: 0 10px 15px 10px; margin-bottom: 15px; border-bottom: 1px solid #334155;">
                <div style="cursor: pointer; color: #94a3b8; font-weight: bold; margin-bottom: 10px; transition: 0.2s;" onclick="exitManual()" onmouseover="this.style.color='white'" onmouseout="this.style.color='#94a3b8'">⬅ 返回身分引導</div>
                <h2 style="margin: 0; font-size: 1.3rem;">📚 操作目錄</h2>
            </div>
            <div id="sidebar-content"></div>
        </div>
        
        <div id="main-content">
            <div id="tab-container"></div>
            <div id="text-box">
                <h3 id="v-title"></h3>
                <p id="v-desc"></p>
                
                <div id="youtube-actions">
                    <button class="yt-btn yt-btn-android" onclick="window.open('https://www.youtube.com/shorts/56zBTa6I6BM', '_blank')">🤖 Android 操作影片</button>
                    <button class="yt-btn yt-btn-ios" onclick="window.open('https://www.youtube.com/shorts/oLcqaVoGOxE', '_blank')">🍎 iOS 操作影片</button>
                </div>
            </div>
            
            <div id="media-container">
                <div id="media-wrapper">
                    <img id="display-img" class="media-content" src="" alt="教學截圖">
                    <video id="display-video" class="media-content" src="" autoplay loop muted playsinline controls></video>
                    
                    <div id="display-pdf-actions">
                        <button id="pdf-view-btn" class="pdf-btn pdf-btn-view">📄 線上瀏覽</button>
                        <button id="pdf-download-btn" class="pdf-btn pdf-btn-dl">⬇️ 下載 PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="pdf-modal">
        <div id="pdf-modal-content">
            <div class="pdf-modal-header">
                <div class="pdf-modal-title" id="pdf-modal-title">PDF 文件</div>
                <div class="pdf-modal-tools">
                    <button class="tool-btn tool-btn-dl" id="modal-inner-dl-btn">⬇️ <span>下載</span></button>
                    <button class="tool-btn tool-btn-close" onclick="closePdfModal()">✖ <span>關閉</span></button>
                </div>
            </div>
            <iframe id="pdf-iframe" src="" style="flex: 1; width:100%; border:none; background: white;"></iframe>
        </div>

        function handleHash() {
            const hash = window.location.hash.substring(1);
            const parts = hash.split('/');
            const route = parts[0];

            if (route === 'welcome' || !route) {
                _renderIntro('page-welcome');
            } else if (route === 'roles') {
                _renderIntro('page-roles');
            } else if (route === 'guide') {
                const r = decodeURIComponent(parts[1] || currentRole);
                if (r) {
                    _renderGuide(r);
                } else {
                    window.location.hash = '#roles';
                }
            } else if (route === 'manual') {
                const id = parts.length > 2 ? decodeURIComponent(parts[2]) : decodeURIComponent(parts[1]);
                if (id && id !== "undefined") {
                    _showManualById(id);
                } else {
                    enterFullManual();
                }
            }
        }

            }

            if (!targetItem.roles.includes(currentRole)) {
                alert("您目前的身分無法查看此內容！請確認您有相應的權限。");
                exitManual();
                return;
            }

            const accBtns = document.querySelectorAll('.acc-btn');
            let targetPanel = null;
            accBtns.forEach(acc => {
                if (acc.innerText.replace(' ▾', '') === targetCat) {
                    targetPanel = acc.nextElementSibling;
                    targetPanel.style.display = 'block'; 
                }
            });

            if (targetPanel) {
                const gBtns = targetPanel.querySelectorAll('.group-btn');
                gBtns.forEach(gb => {
                    if (gb.innerText === targetGroup) {
                        const targetItems = nestedData[targetCat][targetGroup].filter(item => item.roles.includes(currentRole));
                        _renderTabs(targetItems, gb, id);
                    }
                });
            }
        }

        function _buildSidebar() {
            const sidebarContent = document.getElementById('sidebar-content');
            sidebarContent.innerHTML = ''; 
            
            for (const [cat, groups] of Object.entries(nestedData)) {
                let catHasItems = false;
                const acc = document.createElement('button');
                acc.className = 'acc-btn';
                acc.innerText = cat + " ▾";
                
                const panel = document.createElement('div');
                panel.style.display = 'none';
                
                acc.onclick = () => panel.style.display = (panel.style.display==='none'?'block':'none');

                for (const [gName, items] of Object.entries(groups)) {
                    const validItems = items.filter(item => item.roles.includes(currentRole));
                    
                    if (validItems.length > 0) {
                        catHasItems = true;
                        const gb = document.createElement('button');
                        gb.className = 'group-btn';
                        gb.innerText = gName;
                        
                        gb.onclick = () => {
                            window.location.hash = '#manual/' + encodeURIComponent(validItems[0].id);
                        };
                        panel.appendChild(gb);
                    }
                }
                
                if (catHasItems) {
                    sidebarContent.appendChild(acc);
                    sidebarContent.appendChild(panel);
                }
            }
        }

        function _renderTabs(items, btn, activeId) {
            document.querySelectorAll('.group-btn').forEach(b => { b.style.color = '#94a3b8'; b.classList.remove('active'); });
            btn.style.color = '#60a5fa';
            btn.classList.add('active');
            
            const container = document.getElementById('tab-container');
            container.innerHTML = '';
            container.style.display = items.length > 1 ? 'flex' : 'none';

            let activeItem = items.find(i => i.id === activeId);
            if (!activeItem && items.length > 0) activeItem = items[0];

            items.forEach(item => {
                const t = document.createElement('div');
                t.className = 'tab-item';
                t.innerText = item.tabName;
                t.setAttribute('data-id', item.id);
                if (activeItem && item.id === activeItem.id) t.classList.add('active');
                
                t.onclick = () => {
                    window.location.hash = '#manual/' + encodeURIComponent(item.id);
                };
                container.appendChild(t);
            });

            if (activeItem) {
                document.getElementById('v-title').innerText = activeItem.tabName;
                document.getElementById('v-desc').innerText = activeItem.desc;
                updateMedia("../" + activeItem.img, activeItem.tabName);
                
                if(window.innerWidth <= 768 && document.getElementById('sidebar').classList.contains('active')) {
                    toggleMobileSidebar();
                }
            }
        }

        function showIntroPage(pageId) {
            if (pageId === 'page-welcome') window.location.hash = '#welcome';
            else if (pageId === 'page-roles') window.location.hash = '#roles';
            else if (pageId === 'page-guide') {
                if(currentRole) window.location.hash = '#guide/' + encodeURIComponent(currentRole);
                else window.location.hash = '#roles';
            }
        }

        function selectRole(role) {
            window.location.hash = '#guide/' + encodeURIComponent(role);
        }

        function enterFullManual() {
            let firstId;
            outer: for (const cat of Object.keys(nestedData)) {
                for (const group of Object.keys(nestedData[cat])) {
                    const validItems = nestedData[cat][group].filter(item => item.roles.includes(currentRole));
                    if (validItems.length > 0) {
                        firstId = validItems[0].id;
                        break outer;
                    }
                }
            }
            if (firstId) {
                window.location.hash = '#manual/' + encodeURIComponent(firstId);
            }
        }

        function exitManual() {
            if (currentRole) {
                window.location.hash = '#guide/' + encodeURIComponent(currentRole);
            } else {
                window.location.hash = '#roles';
            }
        }

        function jumpToManual(id) {
            window.location.hash = '#manual/' + encodeURIComponent(id);
        }

        function jumpToManualByTitle(targetTitle, targetCat = null) {
            for (const cat of Object.keys(nestedData)) {
                if (targetCat && cat !== targetCat) continue; 
                
                for (const group of Object.keys(nestedData[cat])) {
                    const found = nestedData[cat][group].find(i => i.tabName === targetTitle);
                    if (found) {
                        if(!found.roles.includes(currentRole)) {
                            alert("您目前的身分「" + currentRole + "」無法查看此頁面！請聯絡管理員開放權限。");
                            return;
                        }
                        window.location.hash = '#manual/' + encodeURIComponent(found.id);
                        return;
                    }
                }
            }
            
            let alertMsg = "找不到標題為「" + targetTitle + "」";
            if (targetCat) alertMsg += " 且分類為「" + targetCat + "」";
            alertMsg += " 的教學內容！請確認 Excel 裡的標題名稱是否完全一致。";
            alert(alertMsg);
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function closePdfModal() {
            document.getElementById('pdf-modal').style.display = 'none';
            document.getElementById('pdf-iframe').src = '';
        }

        // 動態判斷並渲染不同檔案類型
        function updateMedia(file, titleStr) {
            const img = document.getElementById('display-img');
            const video = document.getElementById('display-video');
            const pdfActions = document.getElementById('display-pdf-actions');
            const ytActions = document.getElementById('youtube-actions'); // 取得 YouTube 按鈕區塊
            
            img.style.display = 'none';
            video.style.display = 'none';
            pdfActions.style.display = 'none';
            ytActions.style.display = 'none'; // 預設隱藏
            video.pause();

            // 若目前標題包含「影片教學」，則顯示 YouTube 按鈕
            if (titleStr && titleStr.includes('影片教學')) {
                ytActions.style.display = 'flex';
            }

            if (!file) return;

            const ext = file.split('.').pop().toLowerCase();

            if (ext === 'mp4' || ext === 'webm') {
                video.src = file;
                video.style.display = 'block'; 
                video.play();
            } else if (ext === 'pdf') {
                // 顯示精緻版的卡片按鈕
                pdfActions.style.display = 'flex';
                
                // 設定下載行為 (外層按鈕與 Modal 內建按鈕都綁定)
                const downloadFn = () => {
                    const a = document.createElement('a');
                    a.href = file;
                    a.download = file.split('/').pop(); // 自動取檔名
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                document.getElementById('pdf-download-btn').onclick = downloadFn;
                document.getElementById('modal-inner-dl-btn').onclick = downloadFn;
                
                // 設定標題列顯示的 PDF 名稱
                document.getElementById('pdf-modal-title').innerText = titleStr || "PDF 預覽";

                // 綁定線上瀏覽按鈕
                document.getElementById('pdf-view-btn').onclick = () => {
                    document.getElementById('pdf-iframe').src = file + '#toolbar=1&navpanes=0&scrollbar=1';
                    document.getElementById('pdf-modal').style.display = 'flex';
                };
            } else {
                img.src = file;
                img.style.display = 'block'; 
            }
            
            document.getElementById('main-content').scrollTop = 0;
        }
    </script>
</body>
</html>
